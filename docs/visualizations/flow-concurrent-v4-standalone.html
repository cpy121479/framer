  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

svg {

    &lt;div class=&quot;subnote&quot;&gt;读写延迟：线程 pri=0 走 L1（写 5-10 / 读 10-15 拍），其余走 SMC（写 10-20 / 读 70-80 拍）；FIFO 出队即发起读写，到期归还信用并算 rw_done。&lt;/div&gt;

  &lt;div class=&quot;log&quot; id=&quot;fcLog&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    (function () {
      window.addEventListener(&quot;error&quot;, function (e) {
        try {
          var el = document.getElementById(&quot;fcLog&quot;);
          if (el) el.textContent += &quot;\n[JS错误] &quot; + (e.message || e);
        } catch (_) {}
      });
      var CAP = { q0: 8, q1: 8, ct: 16, f0: 8, f1: 8, f2: 8, f3: 8 };
      var SRC = [
        { name: &quot;OH_EXT&quot;, planes: 4, p: 8 / 1235 },
        { name: &quot;OH_INS&quot;, planes: 4, p: 8 / 1235 },
        { name: &quot;APS_EXT&quot;, planes: 8, p: 1 / 1235 },
        { name: &quot;APS_INS&quot;, planes: 8, p: 1 / 1235 },
        { name: &quot;ALM&quot;, planes: 8, p: 4 / 1235 },
        { name: &quot;UART_EXT&quot;, planes: 1, p: 0.06 },
        { name: &quot;UART_INS&quot;, planes: 1, p: 0.06 }
      ];
      var C_AVG = [45, 13, 3, 3, 4, 20, 15];
      var U_W = [6, 4, 2, 1, 1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 6];

      var S = null;
      var playing = false;
      var timer = null;

      function init() {
        return {
          tick: 0, rate: 25, speed: 20,
          entryQ: [], out: null, bufQ: [], threads: [], threadId: 0,
          q0: [], q1: [], ct: [], fifo: [[], [], [], []],
          cred: [64, 64, 64, 64], pend: [], // {t, d, tid}
          peak: { q0: 0, q1: 0, ct: 0, f0: 0, f1: 0, f2: 0, f3: 0 },
          euBusy: [0, 0], euTid: [0, 0],
          stat: { inj: 0, drop: 0, create: 0, done: 0, issIv: 0, issC: 0,
                  dse: 0, deq: 0, bp: 0, rwDone: 0,
                  issT: 0, euT: 0, dseT: 0, deqT: 0,
                  perStream: [0, 0, 0, 0, 0, 0, 0] },
          last: { iv: 0, c: 0, dse: [0, 0, 0, 0], deq: [0, 0, 0, 0],
                  created: 0, bufIn: 0, bufOut: 0, drop: 0, eu: [false, false] },
          outBp: false,
          log: []
        };
      }

      function rnd(n) { return Math.floor(Math.random() * n); }
      function pick(arr) { return arr[rnd(arr.length)]; }

      function makeThread(s, plane, pri) {
        var cAvg = C_AVG[s];
        var dk = pick([-2, -1, 1, 2]);
        var c = Math.max(0, cAvg + dk);
        var n = new Array(15).fill(0);
        var tot = 0;
        for (var j = 0; j &lt; 15; j++) tot += U_W[j];
        var sum = 0;
        for (var j = 0; j &lt; 15; j++) { n[j] = Math.min(7, Math.floor(c * U_W[j] / tot)); sum += n[j]; }
        var rem = c - sum;
        while (rem &gt; 0) {
          var placed = false;
          for (var o = 0; o &lt; 15 &amp;&amp; rem &gt; 0; o++) {
            var order = [0, 14, 1, 13, 2, 12, 3, 11, 4, 10, 5, 9, 6, 8, 7];
            if (n[order[o]] &lt; 7) { n[order[o]]++; rem--; placed = true; }
          }
          if (!placed) break;
        }
        var seq = [];
        seq.push({ t: &quot;iv&quot; });
        for (var k = 0; k &lt; 15; k++) {
          seq.push({ t: &quot;iv&quot; });
          for (var m = 0; m &lt; n[k]; m++) seq.push({ t: &quot;c&quot; });
        }
        return {
          id: S.threadId++, s: s, plane: plane, pri: pri,
          key: s * 8 + plane, seq: seq, idx: 0,
          done: 0, rwDone: 0, rwNeed: c, need: seq.length,
          state: &quot;READY&quot;, cool: 0, isL1: pri === 0
        };
      }

      function pushLog(m) {
        S.log.push(&quot;t&quot; + S.tick + &quot;  &quot; + m);
        if (S.log.length &gt; 6) S.log.shift();
      }

      function tick() {
        S.tick++;
        var last = S.last;
        last.iv = 0; last.c = 0; last.created = 0; last.bufIn = 0; last.bufOut = 0; last.drop = 0;
        for (var di = 0; di &lt; 4; di++) { last.dse[di] = 0; last.deq[di] = 0; }
        S.outBp = false;
        // 1) 注入：7 流 × 平面，按倍率概率
        for (var s = 0; s &lt; 7; s++) {
          var src = SRC[s];
          for (var pl = 0; pl &lt; src.planes; pl++) {
            if (Math.random() &lt; src.p * S.rate) {
              var pri = (s === 0 || s === 5) ? 7 : (s === 6 ? rnd(8) : (Math.random() &lt; 0.3 ? 1 : 0));
              var cid = rnd(32);
              if (S.entryQ.length &lt; 64) S.entryQ.push({ pri: pri, s: s, plane: pl, cid: cid, key: s * 32 + cid });
              else { S.stat.drop++; last.drop++; }
              S.stat.inj++;
              S.stat.perStream[s]++;
            }
          }
        }
        // 2) KOA 出口：空则取最高优先级；有则等 THM 接收
        if (!S.out &amp;&amp; S.entryQ.length) {
          var bi = 0;
          for (var i = 1; i &lt; S.entryQ.length; i++) if (S.entryQ[i].pri &lt; S.entryQ[bi].pri) bi = i;
          S.out = S.entryQ.splice(bi, 1)[0];
        }
        // 3) THM 接收判定（对齐 RTL：缓存放行拍优先，且该拍对 KOA 反压）
        var keyFree = function (k) { return !S.threads.some(function (t) { return t.key === k &amp;&amp; t.state !== &quot;DONE&quot;; }); };
        var poolFree = S.threads.length &lt; 64;
        var bufOk = S.bufQ.length &gt; 0 &amp;&amp; keyFree(S.bufQ[0].key) &amp;&amp; poolFree;
        // 对齐 RTL：同键活跃且缓存未满 → 照收进缓存（即使线程池已满）；键空闲才要求池有空位
        var directOk = !!S.out &amp;&amp; (keyFree(S.out.key) ? poolFree : S.bufQ.length &lt; 8);
        var koRdy = !bufOk &amp;&amp; directOk;
        S.outBp = !!S.out &amp;&amp; !koRdy;
        if (!koRdy &amp;&amp; S.out) S.stat.bp++;
        if (bufOk) {
          var b = S.bufQ.shift();
          S.threads.push(makeThread(b.s, b.plane, b.pri));
          S.stat.create++;
          last.bufOut++;
          pushLog(&quot;缓存放行 → 建线程（键 &quot; + b.key + &quot;）&quot;);
        } else if (S.out &amp;&amp; directOk) {
          if (keyFree(S.out.key)) {
            S.threads.push(makeThread(S.out.s, S.out.plane, S.out.pri));
            S.stat.create++;
            last.created++;
          } else {
            S.bufQ.push(S.out);
            last.bufIn++;
            pushLog(&quot;同键活跃 → 指令入保序缓存（键 &quot; + S.out.key + &quot;，缓存 &quot; + S.bufQ.length + &quot;/8）&quot;);
          }
          S.out = null;
        }
        // 4) 一级发射：READY 线程按 (pri,id) 取 2
        var ready = S.threads.filter(function (t) { return t.state === &quot;READY&quot; &amp;&amp; t.cool === 0 &amp;&amp; t.idx &lt; t.need; });
        ready.sort(function (a, b) { return a.pri - b.pri || a.id - b.id; });
        var winners = ready.slice(0, 2);
        winners.forEach(function (t) {
          var b = t.seq[t.idx];
          if (b.t === &quot;iv&quot;) {
            if (S.q0.length &lt; CAP.q0) { S.q0.push({ tid: t.id, pri: t.pri }); S.stat.issIv++; S.stat.issT++; last.iv++; t.cool = 1; t.idx++; t.state = &quot;COOL&quot;; }
            else if (S.q1.length &lt; CAP.q1) { S.q1.push({ tid: t.id, pri: t.pri }); S.stat.issIv++; S.stat.issT++; last.iv++; t.cool = 1; t.idx++; t.state = &quot;COOL&quot;; }
          } else {
            if (S.ct.length &lt; CAP.ct) { S.ct.push({ tid: t.id, pri: t.pri, tag: rnd(4) }); S.stat.issC++; S.stat.issT++; last.c++; t.cool = 1; t.idx++; t.state = &quot;COOL&quot;; }
          }
        });
        S.threads.forEach(function (t) { if (t.state === &quot;COOL&quot;) { t.cool--; if (t.cool &lt;= 0) t.state = &quot;READY&quot;; } });
        // 5) EU：2 个，各执行 1 个 i/v burst（1 拍）
        last.eu = [S.euBusy[0] &gt; 0, S.euBusy[1] &gt; 0];
        S.stat.euT += (last.eu[0] ? 1 : 0) + (last.eu[1] ? 1 : 0);
        for (var eu = 0; eu &lt; 2; eu++) {
          if (S.euBusy[eu] &gt; 0) { S.euBusy[eu]--; if (S.euBusy[eu] === 0) { var dt = S.euTid[eu]; var th = S.threads.find(function (x) { return x.id === dt; }); if (th) th.done++; } }
          else {
            var poolQ = eu === 0 ? S.q0 : S.q1;
            if (poolQ.length) {
              var bi2 = 0;
              for (var j = 1; j &lt; poolQ.length; j++) if (poolQ[j].pri &lt; poolQ[bi2].pri) bi2 = j;
              var it = poolQ.splice(bi2, 1)[0];
              S.euBusy[eu] = 1; S.euTid[eu] = it.tid;
            }
          }
        }
        // 6) DSE：从 ct 按 tag 选任务 → FIFO（发射即完成）
        for (var d = 0; d &lt; 4; d++) {
          var idx = S.ct.findIndex(function (x) { return x.tag === d; });
          if (idx &gt;= 0 &amp;&amp; S.fifo[d].length &lt; CAP[&quot;f&quot; + d]) {
            var task = S.ct.splice(idx, 1)[0];
            S.fifo[d].push(task);
            S.stat.dse++;
            S.stat.dseT++;
            last.dse[d]++;
            var thd = S.threads.find(function (x) { return x.id === task.tid; });
            if (thd) thd.done++;
          }
        }
        // 7) FIFO 出队 → 发起读写（信用 -1，按模式延迟归还）
        for (var d2 = 0; d2 &lt; 4; d2++) {
          if (S.fifo[d2].length &amp;&amp; S.cred[d2] &gt; 0) {
            var tk = S.fifo[d2].shift();
            S.cred[d2]--;
            S.stat.deq++;
            S.stat.deqT++;
            last.deq[d2]++;
            var th2 = S.threads.find(function (x) { return x.id === tk.tid; });
            var isL1 = th2 ? th2.isL1 : false;
            var isRead = Math.random() &lt; 0.6;
            var delay = isL1 ? (isRead ? 10 + rnd(6) : 5 + rnd(6))
                             : (isRead ? 70 + rnd(11) : 10 + rnd(11));
            S.pend.push({ t: S.tick + delay, d: d2, tid: tk.tid, rw: isRead ? 1 : 0 });
          }
        }
        // 8) 读写完成：到期归还信用 + rw_done
        for (var pi = S.pend.length - 1; pi &gt;= 0; pi--) {
          if (S.pend[pi].t &lt;= S.tick) {
            var p = S.pend.splice(pi, 1)[0];
            if (S.cred[p.d] &lt; 64) S.cred[p.d]++;
            S.stat.rwDone++;
            var th3 = S.threads.find(function (x) { return x.id === p.tid; });
            if (th3) th3.rwDone++;
          }
        }
        // 9) 线程结束：done 满且读写全完成 → 释放
        for (var ti = S.threads.length - 1; ti &gt;= 0; ti--) {
          var tt = S.threads[ti];
          if (tt.done &gt;= tt.need &amp;&amp; tt.rwDone &gt;= tt.rwNeed) {
            S.threads.splice(ti, 1);
            S.stat.done++;
          }
        }
      }

      // ---------- 渲染 ----------
      function chip(kind, label) { var d = document.createElement(&quot;span&quot;); d.className = &quot;chip &quot; + kind; d.textContent = label; return d; }

      function render() {
        var pipe = document.querySelectorAll(&quot;#flowConc .stage&quot;);
        pipe.forEach(function (el) { el.classList.remove(&quot;blocked&quot;); });
        var tok = document.querySelectorAll(&quot;#flowConc .stage .tokens&quot;);
        tok.forEach(function (el) { el.innerHTML = &quot;&quot;; });
        tok[1].appendChild(chip(&quot;ko&quot;, &quot;指令 ×&quot; + S.entryQ.length));
        if (S.out) { tok[2].appendChild(chip(&quot;ko&quot;, &quot;交接中 1 条&quot;)); pipe[2].classList.toggle(&quot;blocked&quot;, S.outBp); }
        tok[3].appendChild(chip(&quot;th&quot;, &quot;缓存 ×&quot; + S.bufQ.length));
        tok[3].appendChild(chip(&quot;th&quot;, &quot;线程 ×&quot; + S.threads.length));
        if (S.last.bufIn) tok[3].appendChild(chip(&quot;ko&quot;, &quot;入缓存 ↑&quot;));
        if (S.last.bufOut) tok[3].appendChild(chip(&quot;th&quot;, &quot;放行建线程 ↑&quot;));
        var l1block = S.threads.some(function (t) { return t.state === &quot;READY&quot; &amp;&amp; t.idx &lt; t.need; }) &amp;&amp;
          ((S.q0.length &gt;= CAP.q0 &amp;&amp; S.q1.length &gt;= CAP.q1) || S.ct.length &gt;= CAP.ct);
        pipe[4].classList.toggle(&quot;blocked&quot;, l1block);
        if (S.last.iv) tok[4].appendChild(chip(&quot;iv&quot;, &quot;i/v ↑&quot; + S.last.iv));
        if (S.last.c) tok[4].appendChild(chip(&quot;c&quot;, &quot;c ↑&quot; + S.last.c));
        if (l1block) tok[4].appendChild(chip(&quot;drop&quot;, &quot;堵：&quot; + ((S.q0.length &gt;= CAP.q0 &amp;&amp; S.q1.length &gt;= CAP.q1) ? &quot;q满&quot; : &quot;ct满&quot;)));
        var l2block = S.fifo.some(function (f) { return f.length &gt;= 8; });
        pipe[5].classList.toggle(&quot;blocked&quot;, l2block);
        for (var dch = 0; dch &lt; 4; dch++) if (S.last.dse[dch]) tok[5].appendChild(chip(&quot;c&quot;, &quot;DSE&quot; + dch + &quot; ↑&quot;));
        if (S.last.eu[0]) tok[5].appendChild(chip(&quot;iv&quot;, &quot;EU0 执行中&quot;));
        if (S.last.eu[1]) tok[5].appendChild(chip(&quot;iv&quot;, &quot;EU1 执行中&quot;));
        var rbablock = S.fifo.some(function (f, i) { return f.length &gt; 0 &amp;&amp; S.cred[i] === 0; });
        pipe[6].classList.toggle(&quot;blocked&quot;, rbablock);
        for (var dch2 = 0; dch2 &lt; 4; dch2++) {
          if (S.last.deq[dch2]) tok[6].appendChild(chip(&quot;c&quot;, &quot;出队 ↑&quot;));
          var pd = S.pend.filter(function (p) { return p.d === dch2; });
          if (pd.length) {
            var nr = pd.filter(function (x) { return x.rw === 1; }).length;
            var nw = pd.length - nr;
            var minT = Math.min.apply(null, pd.map(function (x) { return x.t - S.tick; }));
            tok[6].appendChild(chip(&quot;task&quot;, &quot;DSE&quot; + dch2 + &quot; 读&quot; + nr + &quot;写&quot; + nw + &quot; 剩&quot; + minT + &quot;拍&quot;));
          }
        }
        if (S.stat.drop &gt; 0) tok[1].appendChild(chip(&quot;drop&quot;, &quot;丢弃 ×&quot; + S.stat.drop));

        var st = S.stat;
        var waitN = S.threads.filter(function (t) { return t.done &gt;= t.need &amp;&amp; t.rwDone &lt; t.rwNeed; }).length;
        var t = Math.max(1, S.tick);
        var util = {
          &quot;一级(2/拍)&quot;: st.issT / t / 2,
          &quot;EU(2/拍)&quot;: st.euT / t / 2,
          &quot;DSE(4/拍)&quot;: st.dseT / t / 4,
          &quot;出队+信用(4/拍)&quot;: st.deqT / t / 4,
          &quot;THM建线程(1/拍)&quot;: st.create / t
        };
        var bn = &quot;未饱和&quot;, bnV = 0;
        [&quot;一级(2/拍)&quot;, &quot;EU(2/拍)&quot;, &quot;DSE(4/拍)&quot;, &quot;出队+信用(4/拍)&quot;].forEach(function (kk) {
          if (util[kk] &gt; bnV) { bnV = util[kk]; bn = kk; }
        });
        var pct = function (v) { return Math.round(100 * v) + &quot;%&quot;; };
        document.getElementById(&quot;fcStats&quot;).innerHTML =
          &quot;注入 &lt;b&gt;&quot; + st.inj + &quot;&lt;/b&gt;　丢弃 &lt;b&gt;&quot; + st.drop + &quot;&lt;/b&gt;　建线程 &lt;b&gt;&quot; + st.create + &quot;&lt;/b&gt;　完成 &lt;b&gt;&quot; + st.done + &quot;&lt;/b&gt;&quot; +
          &quot;　一级 i/v &lt;b&gt;&quot; + st.issIv + &quot;&lt;/b&gt; / c &lt;b&gt;&quot; + st.issC + &quot;&lt;/b&gt;　DSE &lt;b&gt;&quot; + st.dse + &quot;&lt;/b&gt;　出队 &lt;b&gt;&quot; + st.deq + &quot;&lt;/b&gt;&quot; +
          &quot;　在途读写 &lt;b&gt;&quot; + S.pend.length + &quot;&lt;/b&gt;　等读写线程 &lt;b&gt;&quot; + waitN + &quot;&lt;/b&gt;　反压拍 &lt;b&gt;&quot; + st.bp + &quot;&lt;/b&gt;&lt;br&gt;&quot; +
          &quot;利用率：一级 &quot; + pct(util[&quot;一级(2/拍)&quot;]) + &quot; · EU &quot; + pct(util[&quot;EU(2/拍)&quot;]) + &quot; · DSE &quot; + pct(util[&quot;DSE(4/拍)&quot;]) +
          &quot; · 出队/信用 &quot; + pct(util[&quot;出队+信用(4/拍)&quot;]) + &quot; · 建线程 &quot; + pct(util[&quot;THM建线程(1/拍)&quot;]) +
          &quot;　&lt;b&gt;瓶颈：&quot; + bn + (bn === &quot;未饱和&quot; ? &quot;&quot; : &quot;（&quot; + pct(bnV) + &quot;）&quot;) + &quot;&lt;/b&gt;&lt;br&gt;&quot; +
          &quot;流注入：OH_EXT &quot; + st.perStream[0] + &quot; · OH_INS &quot; + st.perStream[1] + &quot; · APS_EXT &quot; + st.perStream[2] +
          &quot; · APS_INS &quot; + st.perStream[3] + &quot; · ALM &quot; + st.perStream[4] + &quot; · UART_E &quot; + st.perStream[5] + &quot; · UART_I &quot; + st.perStream[6];

        var tb = document.getElementById(&quot;fcThreads&quot;);
        if (!S.threads.length) { tb.innerHTML = &#x27;&lt;div class=&quot;subnote&quot;&gt;（暂无活跃线程：调大注入倍率即可看到线程池被占满）&lt;/div&gt;&#x27;; }
        else {
          var rows = S.threads.slice(0, 8).map(function (t) {
            var waiting = t.done &gt;= t.need &amp;&amp; t.rwDone &lt; t.rwNeed;
            var stTxt = waiting
              ? &#x27;&lt;span style=&quot;color:var(--destructive)&quot;&gt;等读写(剩&#x27; + (t.rwNeed - t.rwDone) + &#x27;)&lt;/span&gt;&#x27;
              : (t.state + (t.cool &gt; 0 ? &quot;(&quot; + t.cool + &quot;)&quot; : &quot;&quot;));
            var pctD = t.need ? Math.round(100 * t.done / t.need) : 0;
            var pctR = t.rwNeed ? Math.round(100 * t.rwDone / t.rwNeed) : 100;
            return &quot;&lt;tr&gt;&lt;td&gt;#&quot; + t.id + &quot; &quot; + SRC[t.s].name + &quot;-&quot; + t.plane + &quot; pri&quot; + t.pri + &quot;&lt;/td&gt;&quot; +
              &quot;&lt;td&gt;&quot; + stTxt + &quot;&lt;/td&gt;&quot; +
              &quot;&lt;td&gt;发 &quot; + t.idx + &quot;/&quot; + t.need + &quot;&lt;/td&gt;&quot; +
              &quot;&lt;td&gt;完 &quot; + t.done + &quot; (&quot; + pctD + &quot;%)&lt;/td&gt;&quot; +
              &quot;&lt;td&gt;rw &quot; + t.rwDone + &quot;/&quot; + t.rwNeed + &quot; (&quot; + pctR + &quot;%)&quot; + (t.isL1 ? &quot; L1&quot; : &quot; SMC&quot;) + &quot;&lt;/td&gt;&lt;/tr&gt;&quot;;
          }).join(&quot;&quot;);
          var more = S.threads.length &gt; 8 ? &quot;&lt;tr&gt;&lt;td colspan=&#x27;5&#x27; class=&#x27;subnote&#x27;&gt;… 还有 &quot; + (S.threads.length - 8) + &quot; 个（显示最早创建的一批）&lt;/td&gt;&lt;/tr&gt;&quot; : &quot;&quot;;
          tb.innerHTML = &quot;&lt;table&gt;&lt;tr&gt;&lt;th&gt;线程&lt;/th&gt;&lt;th&gt;状态&lt;/th&gt;&lt;th&gt;发射&lt;/th&gt;&lt;th&gt;完成&lt;/th&gt;&lt;th&gt;读写&lt;/th&gt;&lt;/tr&gt;&quot; + rows + more + &quot;&lt;/table&gt;&quot;;
        }

        var caps = { q0: S.q0.length, q1: S.q1.length, ct: S.ct.length, f0: S.fifo[0].length, f1: S.fifo[1].length, f2: S.fifo[2].length, f3: S.fifo[3].length };
        for (var b in CAP) {
          if (caps[b] &gt; S.peak[b]) S.peak[b] = caps[b];
          var ce = document.getElementById(&quot;fcCap&quot; + b.toUpperCase());
          if (ce) ce.textContent = caps[b] + &quot;/&quot; + CAP[b] + &quot; 峰&quot; + S.peak[b];
          var box = document.querySelector(&#x27;#flowConc [data-b=&quot;&#x27; + b + &#x27;&quot;]&#x27;);
          box.classList.toggle(&quot;full&quot;, caps[b] &gt;= CAP[b]);
          var cells = box.querySelector(&quot;.cells&quot;);
          cells.innerHTML = &quot;&quot;;
          for (var k = 0; k &lt; CAP[b]; k++) {
            var c = document.createElement(&quot;span&quot;);
            c.className = &quot;cell&quot; + (k &lt; caps[b] ? &quot; on&quot; : &quot;&quot;);
            if (caps[b] &gt;= CAP[b]) c.className += &quot; full&quot;;
            cells.appendChild(c);
          }
        }
        for (var d = 0; d &lt; 4; d++) {
          var box2 = document.querySelector(&#x27;#flowConc [data-b=&quot;f&#x27; + d + &#x27;&quot;]&#x27;);
          var rb = box2.querySelector(&quot;.rba&quot;);
          rb.classList.toggle(&quot;low&quot;, S.cred[d] &lt;= 16);
          rb.querySelector(&quot;i&quot;).style.width = (100 * S.cred[d] / 64) + &quot;%&quot;;
          var re = document.getElementById(&quot;fcRba&quot; + d);
          if (re) re.textContent = S.cred[d];
          var pe = document.getElementById(&quot;fcPend&quot; + d);
          if (pe) pe.textContent = &quot;在途&quot; + S.pend.filter(function (p) { return p.d === d; }).length;
        }
        var le = document.getElementById(&quot;fcLog&quot;);
        if (le) le.textContent = S.log.join(&quot;\n&quot;);
        var rve = document.getElementById(&quot;fcRateV&quot;);
        if (rve) rve.textContent = &quot;×&quot; + S.rate;
        var sve = document.getElementById(&quot;fcSpeedV&quot;);
        if (sve) sve.textContent = S.speed + &quot;拍/s&quot;;
        var pbe = document.getElementById(&quot;fcPlay&quot;);
        if (pbe) pbe.textContent = playing ? &quot;⏸ 暂停（点此停止）&quot; : &quot;▶ 播放（点此开始）&quot;;
      }

      function doTick() { tick(); render(); }

      function play() {
        if (playing) return;
        playing = true;
        timer = setInterval(function () { doTick(); }, Math.max(10, Math.round(1000 / S.speed)));
        render();
      }
      function pause() {
        playing = false;
        if (timer) { clearInterval(timer); timer = null; }
        render();
      }

      S = init();
      document.getElementById(&quot;fcRate&quot;).addEventListener(&quot;input&quot;, function (e) { S.rate = +e.target.value; render(); });
      document.getElementById(&quot;fcSpeed&quot;).addEventListener(&quot;input&quot;, function (e) {
        S.speed = +e.target.value;
        if (playing) { clearInterval(timer); timer = setInterval(function () { doTick(); }, Math.max(10, Math.round(1000 / S.speed))); }
        render();
      });
      document.getElementById(&quot;fcPlay&quot;).addEventListener(&quot;click&quot;, function () { playing ? pause() : play(); });
      document.getElementById(&quot;fcStep&quot;).addEventListener(&quot;click&quot;, function () {
        pause(); doTick(); pushLog(&quot;单步：已走到 t&quot; + S.tick); render();
      });
      document.getElementById(&quot;fcReset&quot;).addEventListener(&quot;click&quot;, function () { pause(); S = init(); render(); });
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
